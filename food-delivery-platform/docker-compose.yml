name: food-delivery-platform

networks:
  food-delivery-net:

services:
  # ------------------------------------------------------------------ infra
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:29092"          # host clients (demo scripts) -> PLAINTEXT_HOST
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTES: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [food-delivery-net]

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/scripts/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["bash", "/create-topics.sh"]
    restart: "no"
    networks: [food-delivery-net]

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [food-delivery-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: food-delivery
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    networks: [food-delivery-net]

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    ports:
      - "8091:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH_ENABLED: "false"
    depends_on:
      mongo:
        condition: service_healthy
    networks: [food-delivery-net]

  # --------------------------------------------------------------- services
  customer-service:
    build: ./services/customer-service
    image: fooddelivery/customer-service
    container_name: customer-service
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      MONGO_URL: mongodb://mongo:27017/customer-db
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks: [food-delivery-net]

  restaurant-service:
    build: ./services/restaurant-service
    image: fooddelivery/restaurant-service
    container_name: restaurant-service
    ports:
      - "8082:8082"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      MONGO_URL: mongodb://mongo:27017/restaurant-db
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks: [food-delivery-net]

  order-service:
    build: ./services/order-service
    image: fooddelivery/order-service
    container_name: order-service
    ports:
      - "8083:8083"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      MONGO_URL: mongodb://mongo:27017/order-db
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks: [food-delivery-net]

  payment-service:
    build: ./services/payment-service
    image: fooddelivery/payment-service
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      MONGO_URL: mongodb://mongo:27017/payment-db
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks: [food-delivery-net]

  delivery-service:
    build: ./services/delivery-service
    image: fooddelivery/delivery-service
    container_name: delivery-service
    ports:
      - "8085:8085"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      MONGO_URL: mongodb://mongo:27017/delivery-db
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks: [food-delivery-net]

  notification-service:
    build: ./services/notification-service
    image: fooddelivery/notification-service
    container_name: notification-service
    ports:
      - "8086:8086"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      MONGO_URL: mongodb://mongo:27017/notification-db
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks: [food-delivery-net]

  admin-service:
    build: ./services/admin-service
    image: fooddelivery/admin-service
    container_name: admin-service
    ports:
      - "8087:8087"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      MONGO_URL: mongodb://mongo:27017/admin-db
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks: [food-delivery-net]
